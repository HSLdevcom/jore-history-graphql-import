name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-cd:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-typescript.yml@latest
    with:
      checkAndTestOutsideDocker: true
      checkAndTestInsideDocker: false
    secrets: inherit
