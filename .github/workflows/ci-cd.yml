name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

jobs:
  build-check-test-push:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-typescript.yml@latest
    secrets: inherit
    with:
      checkAndTestOutsideDocker: true
      checkAndTestInsideDocker: true